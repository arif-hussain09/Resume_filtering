[project]
name = "resume-filtering"
version = "0.1.0"
description = "AI resume filtering: LLM extraction + multi-strategy matching + explainable scoring with PDF evidence highlighting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-groq>=1.1.3,<2",
    "numpy>=2,<3",
    "pydantic>=2.11,<3",
    "pymupdf>=1.26,<2",
    "python-dotenv>=1.1,<2",
    "pytest>=8.4,<9",
    "rapidfuzz>=3.14,<4",
    "sentence-transformers>=6,<7",
    "streamlit>=1.50,<2",
]
